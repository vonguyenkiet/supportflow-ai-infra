name: Infrastructure stack
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BACKEND_PATH: ./_sources/backend
      WEB_PATH: ./_sources/web
    steps:
      - uses: actions/checkout@v4
      - name: Read immutable source commits
        id: sources
        run: |
          python - <<'PY'
          import json, os, re
          values=json.load(open('sources.lock.json'))
          if set(values) != {'backend', 'web'} or any(not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha) for sha in values.values()):
              raise SystemExit('sources.lock.json must pin backend and web to full commit SHAs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name, sha in values.items(): out.write(f'{name}={sha}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: supportflow-ai/ai-it-service-desk
          ref: ${{ steps.sources.outputs.backend }}
          path: _sources/backend
      - uses: actions/checkout@v4
        with:
          repository: supportflow-ai/ai-it-service-desk-web
          ref: ${{ steps.sources.outputs.web }}
          path: _sources/web
      - name: Set up smoke test runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest validation dependencies
        run: pip install jsonschema
      - name: Run manifest validator unit tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Validate release manifest schema
        run: python scripts/validate_release_manifest.py
      - name: Validate configuration
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml config --quiet
      - name: Build and start disposable stack
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml up --build -d --wait --wait-timeout 300
      - name: Explicit demo setup and requester smoke
        run: |
          docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml run --rm migrate seed-demo
          bash deploy/smoke/smoke-test.sh
          curl --fail --silent http://localhost/ > /dev/null
          curl --fail --silent http://localhost/health/live > /dev/null
          curl --fail --silent http://localhost/health/ready > /dev/null
      - name: Diagnostics
        if: always()
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml logs --no-color
      - name: Remove disposable CI stack
        if: always()
        run: docker compose --env-file .env.local.example -f compose.yaml -f compose.local.yaml down -v

  publish-minio:
    name: Publish MinIO image to GHCR
    runs-on: ubuntu-24.04
    needs: smoke
    if: github.repository_owner == 'supportflow-ai' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/codex/infra-handoff' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push MinIO image
        id: build-minio
        run: |
          IMAGE="ghcr.io/supportflow-ai/servicedesk-minio:sha-${{ github.sha }}"
          docker build -f deploy/minio/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null | awk -F'@' '{print $2}')
          echo "minio_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "MinIO Digest: $DIGEST"
      - name: Record published MinIO artifact digest
        run: |
          mkdir -p artifacts/ghcr
          cat <<EOF > artifacts/ghcr/minio-digest.json
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "images": {
              "minio": "ghcr.io/supportflow-ai/servicedesk-minio@${{ steps.build-minio.outputs.minio_digest }}"
            }
          }
          EOF
          cat artifacts/ghcr/minio-digest.json
      - uses: actions/upload-artifact@v4
        with:
          name: minio-ghcr-digest-${{ github.sha }}
          path: artifacts/ghcr/minio-digest.json
